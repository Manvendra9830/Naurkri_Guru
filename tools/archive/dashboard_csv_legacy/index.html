<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naukri_Guru — Application Dashboard</title>
    <meta name="description" content="Naukri_Guru AI-Powered Job Automation Platform - Application History Dashboard">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #1e293b;
            --border: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --accent: #6366f1;
            --accent-hover: #818cf8;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border-bottom: 1px solid var(--border);
            padding: 24px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .header .subtitle {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 400;
        }

        .stats-bar {
            display: flex;
            gap: 24px;
            padding: 20px 40px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
        }

        .stat-card {
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px 24px;
            min-width: 160px;
            transition: border-color 0.2s;
        }

        .stat-card:hover { border-color: var(--accent); }

        .stat-card .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--accent);
        }

        .stat-card .stat-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 4px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px 40px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            background: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        th, td {
            padding: 14px 18px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            background: var(--bg-primary);
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            position: sticky;
            top: 0;
            z-index: 1;
        }

        tr:hover { background: rgba(99, 102, 241, 0.05); }

        td { font-size: 0.9rem; }

        a {
            color: var(--accent);
            text-decoration: none;
            transition: color 0.2s;
        }

        a:hover { color: var(--accent-hover); text-decoration: underline; }

        .sl-column { width: 50px; text-align: center; color: var(--text-secondary); }

        .sort-button {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0 5px;
            font-size: 12px;
            color: var(--text-secondary);
            transition: color 0.2s;
        }

        .sort-button:hover { color: var(--accent); }

        .applied-column { width: 70px; text-align: center; }

        .tick {
            color: var(--success);
            font-weight: bold;
            font-size: 1.1rem;
        }

        .badge-easy {
            background: rgba(34, 197, 94, 0.15);
            color: var(--success);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.78rem;
            font-weight: 500;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-state h2 { font-size: 1.2rem; margin-bottom: 8px; color: var(--text-primary); }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h1 id="dashboard-title">Naukri_Guru</h1>
            <div class="subtitle">AI-Powered Job Automation Platform — Application History</div>
        </div>
        <div style="color: var(--text-secondary); font-size: 0.85rem;">
            Developer: Manvendra Singh
        </div>
    </div>

    <div class="stats-bar" id="statsBar">
        <div class="stat-card">
            <div class="stat-value" id="totalJobs">—</div>
            <div class="stat-label">Total Applications</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="easyApplied">—</div>
            <div class="stat-label">Easy Applied</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="externalApps">—</div>
            <div class="stat-label">External Links</div>
        </div>
    </div>

    <div class="container">
        <table id="jobsTable">
            <thead>
                <tr>
                    <th class="sl-column">Sl</th>
                    <th>Job Title</th>
                    <th>Company</th>
                    <th>HR Contact</th>
                    <th>
                        External Link
                        <button class="sort-button" onclick="sortByExternalLink()">↕️</button>
                    </th>
                    <th class="applied-column">Applied</th>
                </tr>
            </thead>
            <tbody id="jobsBody"></tbody>
        </table>
    </div>

    <script>
        let sortOrder = 'asc';
        let jobsData = [];

        function createTableRow(job, index) {
            const row = document.createElement('tr');

            const slCell = document.createElement('td');
            slCell.textContent = index + 1;
            slCell.className = 'sl-column';
            row.appendChild(slCell);

            const titleCell = document.createElement('td');
            const titleLink = document.createElement('a');
            titleLink.href = job.Job_Link;
            titleLink.textContent = job.Title;
            titleLink.target = '_blank';
            titleCell.appendChild(titleLink);
            row.appendChild(titleCell);

            const companyCell = document.createElement('td');
            companyCell.textContent = job.Company;
            row.appendChild(companyCell);

            const hrCell = document.createElement('td');
            if (job.HR_Name && job.HR_Name !== 'Unknown') {
                const hrLink = document.createElement('a');
                hrLink.href = job.HR_Link;
                hrLink.textContent = job.HR_Name;
                hrLink.target = '_blank';
                hrCell.appendChild(hrLink);
            } else {
                hrCell.textContent = 'N/A';
                hrCell.style.color = 'var(--text-secondary)';
            }
            row.appendChild(hrCell);

            const extCell = document.createElement('td');
            const appliedCell = document.createElement('td');
            appliedCell.className = 'applied-column';

            if (job.External_Job_link === 'Easy Applied') {
                const badge = document.createElement('span');
                badge.className = 'badge-easy';
                badge.textContent = 'Easy Applied';
                extCell.appendChild(badge);
                appliedCell.innerHTML = '<span class="tick">✓</span>';
            } else if (job.External_Job_link) {
                const extLink = document.createElement('a');
                extLink.href = job.External_Job_link;
                extLink.textContent = 'External Link';
                extLink.target = '_blank';

                extLink.addEventListener('click', async () => {
                    try {
                        const response = await fetch(`/applied-jobs/${job.Job_ID}`, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' }
                        });
                        if (response.ok) {
                            appliedCell.innerHTML = '<span class="tick">✓</span>';
                            job.Date_Applied = new Date().toISOString();
                        }
                    } catch (error) {
                        console.error('Error updating applied date:', error);
                    }
                });

                extCell.appendChild(extLink);
                if (job.Date_Applied !== 'Pending') {
                    appliedCell.innerHTML = '<span class="tick">✓</span>';
                }
            } else {
                extCell.textContent = 'N/A';
                extCell.style.color = 'var(--text-secondary)';
            }
            row.appendChild(extCell);
            row.appendChild(appliedCell);

            return row;
        }

        function updateStats(jobs) {
            document.getElementById('totalJobs').textContent = jobs.length;
            const easy = jobs.filter(j => j.External_Job_link === 'Easy Applied').length;
            document.getElementById('easyApplied').textContent = easy;
            document.getElementById('externalApps').textContent = jobs.length - easy;
        }

        function sortByExternalLink() {
            sortOrder = sortOrder === 'asc' ? 'desc' : 'asc';
            jobsData.sort((a, b) => {
                const valueA = a.External_Job_link || '';
                const valueB = b.External_Job_link || '';
                return sortOrder === 'asc' ? valueA.localeCompare(valueB) : valueB.localeCompare(valueA);
            });

            const tbody = document.getElementById('jobsBody');
            tbody.innerHTML = '';
            jobsData.forEach((job, index) => {
                tbody.appendChild(createTableRow(job, index));
            });
        }

        fetch('/applied-jobs')
            .then(response => response.json())
            .then(jobs => {
                jobsData = jobs;
                updateStats(jobs);
                const tbody = document.getElementById('jobsBody');
                if (jobs.length === 0) {
                    const row = document.createElement('tr');
                    row.innerHTML = '<td colspan="6"><div class="empty-state"><h2>No Applications Yet</h2><p>Run Naukri_Guru to start applying and data will appear here.</p></div></td>';
                    tbody.appendChild(row);
                } else {
                    jobs.forEach((job, index) => {
                        tbody.appendChild(createTableRow(job, index));
                    });
                }
            })
            .catch(error => {
                console.error('Error:', error);
                const tbody = document.getElementById('jobsBody');
                const row = document.createElement('tr');
                row.innerHTML = '<td colspan="6"><div class="empty-state"><h2>No Data Available</h2><p>Run Naukri_Guru first to generate application history.</p></div></td>';
                tbody.appendChild(row);
            });
    </script>
</body>
</html>
